########################################################################################
#  Stage-2: 从「纯 SCD 预训练」ckpt 接保守力（gradient）微调，5 epoch。
#  Stage-1 = experimental/configs/omat24/mptrj/experiments/scd/pretrain_pure_N2L2C64.yml
#
#  与既有对照臂（direct/DeNS 预训练 -> gradft）保持 step-for-step 可比：
#    gradient/equiformer_v3_grad-finetune_N@2_L@2_C@64_pt-dens-ft-no-reg_hybridmuon-
#      moonlight-mlr@1.5e-4-alr@5e-5-epochs@5-bs@16x8x4-maxatoms150-wd@1e-3_loss-e5-f10-s100_ablation.yml
#  本文件相对该对照臂只改三处：(1) model.name/SCD 开关（必须，见下）
#  (2) scd_adanorm_detach_node_feat: False（保守力正确性，必须）
#  (3) optim.matmul_precision: high（TF32）+ warmup 0.1 -> 0.5。其余全部一致。
#
#  ★★ 换 stage-1 臂时必须同步的键 —— 对不上就是 load_model 的 shape assert 崩 ★★
#  AdaNorm 的 fc[0] 输入维 = cond_channels + (num_channels if use_node_feat else 0)
#  （layer_norm.py:401），所以 scd_adanorm_use_node_feat 直接决定
#  blocks.*.norm_1.fc.0.weight 的形状（C=64 时）：
#      use_node_feat: False -> [64,  64]
#      use_node_feat: True  -> [64, 128]
#  scd_adanorm_scope 决定 fc[3] 的输出维（per_degree/C=64/lmax=2 -> [448, 64]）。
#  这三项 + scd_inject + num_channels 必须与 stage-1 逐字一致。
#
#  各 stage-1 臂 -> 本文件应取的值（取自各 ckpt 内嵌 config，已逐个核对）：
#    N2L2C64_scd_adanorm_freeze_sphere            use_node_feat: False  <- 本文件当前配置
#    N2L2C64_scd_adanorm_nodefeat_freeze_none     use_node_feat: True
#    N2L2C64_scd_adanorm_nodefeat_freeze_sphere   use_node_feat: True
#    N2L2C64_scd_input_freeze_none                scd_inject: input（无 AdaNorm，须一并改 scd_inject）
#  注：scd_freeze_element_embedding 只改 requires_grad、不改形状，两边不一致不会报错。
#
#  ===== 精度/编译档位：TF32 + eager（已核对代码，非默认保守选择）==================
#  TF32  -> 开（optim.matmul_precision: high）。全局 fp32 matmul 降精度，与 amp 正交，
#           保守力双反向下安全；仓库自己的 30M gradft 生产配置（gradient/...CONT-from-
#           adamw-refine...yml:329）已在用，有实跑背书。
#  compile -> 关。两条路都不可用：
#    (a) model.enable_compile + compile_dynamic: True 在本配置下**必崩**。
#        use_force_cond: False 时 SCD 把 force_embedding 退化成 0 维标量
#        （equiformer_v3_scd.py:320），而 _conservative_compiled_forward 无条件把它
#        当成 [N, ...] 的节点级张量处理：_prime() 里 torch.zeros(P, *fe.shape[1:])
#        对 0 维 fe 得到 [P]（equiformer_v3_dens.py:639），dynamic_dims 又对它做
#        mark_dynamic(fe, 0)（:670）—— trace 例子与真实入参维数不符。
#        现有测试 test_equiformer_v3_scd.py 的 B 档只覆盖了 compile_dynamic=False
#        且 use_force_cond=True，没碰到这个组合。
#    (b) compile_dynamic: False 可以绕开 (a)，但 CompiledForceRegion 按 shape 签名缓存
#        （compile_utils.py:380），MPtrj 每个 batch 的原子/边数都不同 -> 每步重编译。
#    (c) 即使修好 (a)，enable_compile 在本路径上大概率是负收益：
#        _conservative_compiled_forward 为了喂 eager 的 dens_block，会**额外跑一整次
#        core_compute**（equiformer_v3_dens.py:686-695）；而微调期 use_denoising_pos
#        False -> dens_block 输出被零 mask 吃掉，这一整次前向+反向纯属浪费。
#        eager 的 _forward_gradient 复用同一份 x，没有这个开销。
#        => 想上 compile，得先修 (a) 并让 dens_block 在 regress_forces 且非去噪时短路。
#  优化器另有 optim.use_compile（外层 torch.compile）：对保守力双反向本就不稳，同样关。
########################################################################################

dataset:
  train:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/train
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True
    transforms:
      normalizer:
        energy:
          mean:     0.0
          rmsd:     0.8124567446457275    # (1) Following eSEN
                                          # (2) Remove the division after sum aggregation for energy prediction
        forces:
          mean:     0.0
          rmsd:     0.8124567446457275
        stress:
          mean:     0.0
          rmsd:     0.8124567446457275

      element_references:
        energy:
          file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_energy_element_references.npz

    max_atoms: 150        # 与对照臂 gradft 一致（丢掉 ~0.82% 的大晶胞尾部）。SCD 预训练阶段没设，
                          # 但 A/B 比的是 stage-2，这里对齐对照臂才是正确取舍。

  val:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/val
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True


trainer:              equiformer_v3_dens_trainer


logger:
  name:               wandb
  project:            equiformer_v3_mptrj


hide_eval_progressbar: False


evaluation_metrics:
  primary_metric: forces_mae
  metrics:
    energy:
      - mae
      - per_atom_mae
    forces:
      - mae
      - cosine_similarity
    stress:
      - mae


outputs:
  energy:
    level:                system
    property:             energy
  forces:
    level:                atom
    property:             forces
    train_on_free_atoms:  True
    eval_on_free_atoms:   True
  stress:
    level:                system
    property:             stress


loss_functions:
  - energy:
      fn:                 per_atom_mae
      coefficient:        5      # E:F:S = 5:10:100，与对照臂一致
  - forces:
      fn:                 l2mae
      coefficient:        10
  - stress:
      fn:                 mae
      coefficient:        100


model:
  ######################################################################################
  #  架构必须与 stage-1 逐项一致，否则 load_pretrained_weights 的 shape 匹配会大面积落空。
  #  **model.name 必须是 equiformer_v3_scd，不能退回 equiformer_v3**：SCD 的 AdaNorm 把
  #  原 norm 包了一层，ckpt 里的键是 blocks.*.norm_1.norm.affine_weight + blocks.*.norm_1.fc.*
  #  （已核对 best_checkpoint.pt 的 data.pkl）。用裸 equiformer_v3 加载，norm 的 affine 与
  #  整套 AdaNorm fc 会被静默跳过 —— 预训练学到的调制全丢。
  ######################################################################################
  name:                         equiformer_v3_scd

  # ---- SCD 开关：与 stage-1 逐项对齐，只改 detach_node_feat ----
  use_scd:                      True    # 必须 True：False 时 _rebuild_blocks_with_adanorm 不执行，
                                        # AdaNorm 模块根本不存在，ckpt 对不上
  use_force_cond:               False   # 与 stage-1 一致。ckpt 里没有 force_embedding.* 键
                                        # （已核对），设 True 会凭空造一个随机初始化的空转模块
  scd_inject:                   adanorm
  scd_adanorm_targets:          ['attn', 'ffn']
  scd_adanorm_scope:            per_degree
  scd_adanorm_use_node_feat:    False   # ★ 必须与 stage-1 一致，否则 fc[0] 形状对不上直接崩。
                                        # 当前对应 N2L2C64_scd_adanorm_freeze_sphere 臂（该 ckpt 的
                                        # blocks.0.norm_1.fc.0.weight = [64, 64]）。换臂见文件头对照表。
                                        # 附带好处：False 时调制不依赖节点特征 x，「能量经调制系数依赖
                                        # 坐标」这条路径根本不存在 => 保守力 F = -dE/dpos 自动严格成立，
                                        # 不需要再管下面的 detach 开关。
  scd_adanorm_detach_node_feat: False   # use_node_feat=False 时本项**惰性**（layer_norm.py:459 的
                                        # `if self.use_node_feat:` 不进入），保留只为切到 use_node_feat=True
                                        # 的臂时不至于漏改 —— 那时它**必须**是 False：detach 会截断能量对
                                        # 坐标的一条依赖路径，使 autograd 的 -dE/dpos 不是真实梯度
                                        # （docs/SCD_NOTES.md §7.4，有限差分实测偏差比噪声地板高约 600 倍）。
  scd_p_dropcond:               0.2     # 微调期 do_self_cond 恒 False，本项与 cond_clip 均不生效，
  scd_cond_clip:                100.0   # 保留只为与 stage-1 对齐、便于 diff
  scd_detach_cond:              False
  scd_reg_noise_std:            0.0
  scd_freeze_element_embedding: none    # 有意与 stage-1（freeze_sphere 臂用的是 sphere）**不同**：
                                        # 冻结是为了防预训练期嵌入塌缩，监督微调阶段应放开。
                                        # 本项只改 requires_grad、不改任何形状 => 不影响 ckpt 加载。
  scd_freeze_mask_token:        False   # 微调期 cond 恒等于 mask_token，它会持续收到真实梯度。
                                        # 想让「无条件工作点」完全固定在预训练末态，改 True。

  use_pbc:                      True
  use_pbc_single:               True      # Process batch PBC graphs one at a time.
                                          # This argument is set to True when training on MPtrj.
  otf_graph:                    True

  regress_forces:               True
  regress_stress:               True    # 保守力路径的 stress 来自对 displacement 求导，
                                        # 不需要 stress_block（它只在 direct_prediction 下构造），
                                        # 所以 stage-1 ckpt 没有 stress_block.* 键也无妨
  direct_prediction:            False   # forces = -dE/dx，stress from virial

  max_neighbors:                300
  max_radius:                   6.0
  num_radial_basis:             10
  max_num_elements:             128

  num_layers:                   2
  num_channels:                 64
  attn_hidden_channels:         32
  num_heads:                    8
  attn_alpha_channels:          64
  attn_value_channels:          16
  ffn_hidden_channels:          512
  norm_type:                    'merge_layer_norm'

  lmax:                         2
  mmax:                         2
  attn_grid_resolution_list:    [14,  8]
  ffn_grid_resolution_list:     [14, 14]

  edge_channels:                128
  use_atom_edge_embedding:      True
  use_envelope:                 True

  attn_activation:              'sep-merge_gates2_swiglu'
  use_attn_renorm:              True
  use_add_merge:                False
  use_rad_l_parametrization:    True
  softcap:                      null
  ffn_activation:               'sep-merge_gates2_swiglu'
  use_grid_mlp:                 True

  use_gate_force_head:          True    # direct_prediction=False 下 force_block 不构造，本项对
                                        # dens_block 仍生效；与 stage-1 一致以保证 dens_block 可加载

  alpha_drop:                   0.0
  attn_mask_rate:               0.0
  attn_weights_drop:            0.0     # 微调关掉（stage-1 是 0.1）；dropout 无权重，不影响加载
  value_drop:                   0.0
  drop_path_rate:               0.0     # 微调关掉（stage-1 是 0.1）
  proj_drop:                    0.0
  ffn_drop:                     0.0

  enable_compile:               False   # 见文件头「精度/编译档位」(a)(b)(c)
  compile_dynamic:              False   # enable_compile 关时无意义，显式写出以免误开
  use_amp:                      False   # 保守力走纯 fp32；bf16/fp16 与双反向的组合未在本路径验证

  gradient_checkpointing_block_list:    [0, 0]      # length == num_layers；显存紧张改 [1, 1]

  enforce_max_neighbors_strictly:       True

  avg_num_nodes:                1       # Remove the division after sum aggregation over nodes for energy prediction


optim:
  ######################################################################################
  #  保守力 = double backward，fp32（不要传 --amp：amp 会在 so3.py 的 Wigner 构造上
  #  报 Float/Half index_put 失配）。单卡显存只取决于 per-GPU batch_size，与卡数无关。
  ######################################################################################
  batch_size:                   16      # per-GPU；8 GPU x 16 x accum4 = global 512（与对照臂同）
  grad_accumulation_steps:      4
  eval_batch_size:              16
  load_balancing:               atoms
  num_workers:                  0       # lmdb env not fork-safe -> num_workers>0 segfaults
  lr_initial:                   0.00005 # AdamW lr for the NON-matrix params (biases, norms, embeddings)

  matmul_precision:             high    # ★ TF32：加速 fp32 matmul（默认 highest = 纯 fp32）。
                                        # 全局开关，eager/compile 都生效，只影响 fp32 matmul。
                                        # 想做纯 fp32 数值基线时改回 highest。

  optimizer:                    HybridMuon
  optimizer_params:
    weight_decay:               0.001
    update_scale:               moonlight
    muon_lr:                    0.00015   # 与对照臂同值，保证 A/B 可比。
                                          # 注意本臂的起点更"生"（见下 load_pretrained_weights 说明），
                                          # 若 ep1 能量损失下不去，这是第一调项（往上，不是往下）。
    momentum:                   0.95
    nesterov:                   True
    ns_steps:                   5
    betas:                      [0.9, 0.95]
    eps:                        1.0e-8
    # --- Muon-side divergence guard [skip-step protection] ---------------------------
    skip_nonfinite:             True
    spike_factor:               8.0
    spike_ema_decay:            0.99
    spike_warmup_steps:         200
    spike_max_consecutive_skips: 25
    spike_abs_threshold:        null   # N2L2C64 上 abs=4.0 是 30M 的调法，会误杀
    spike_abs_max_consecutive:  10
    log_every:                  200
  scheduler:                    LambdaLR
  scheduler_params:
    lambda_type:                cosine
    warmup_factor:              0.001
    warmup_epochs:              0.1     # 与对照臂对齐。本臂 energy head 是未训练状态（见下），
                                        # 而 forces/stress 全由它求导得到；开局不稳可上调到 0.5。
    lr_min_factor:              0.01

  max_epochs:                   5
  clip_grad_norm:               100
  ema_decay:                    0.999

  eval_every:                   5000

  use_denoising_pos:            False   # 微调不做去噪辅助任务。
                                        # 副作用（DDP 安全，已核对）：dens_block 仍被构造并前向，
                                        # 但输出被全零 noise_mask 吃掉 -> 零梯度而非无梯度；
                                        # scd_cond_head 同理靠 `0.0 * ...` 留在图里
                                        # （equiformer_v3_scd.py:271-275）。两者都不会触发
                                        # find_unused_parameters=False 的 reduction 报错。
  denoising_pos_params:                 # use_denoising_pos=False 时全部惰性，但 trainer 会
    prob:                       0.0     # 无条件 DenoisingPosParams(**...) 解析，故必须存在
    fixed_noise_std:            True    # trainer 断言必须为 True
    std:                        0.04
    corrupt_ratio:              null
    all_atoms:                  True
    num_steps:                  50
    std_low:                    0.01
    std_high:                   0.5
    min_num_atoms:              null
    strict_max_ratio:           null
  denoising_pos_coefficient:    1.0

  use_compile:                  False   # 外层 torch.compile：对保守力双反向不稳，且与
                                        # model.enable_compile 互斥（trainer._setup_compile 会报错）

  ######################################################################################
  #  Stage-1（纯 SCD 预训练）ckpt。逐 key shape 匹配的非严格加载
  #  （equiformer_v3_dens_trainer.py:1259-1273），对不上的只打一行 log。
  #
  #  实际迁移情况（已 unzip 核对该 ckpt 的键表）：
  #    backbone / AdaNorm(norm_1.fc.*, norm_1.norm.affine_*) / dens_block / scd_*  -> 全部迁移
  #    force_block.*      -> ckpt 有，但 direct_prediction=False 下不构造 => 自动跳过（符合预期）
  #    stress_block.*     -> ckpt 无，本配置也不构造 => 无事
  #    force_embedding.*  -> ckpt 无，use_force_cond=False 也不构造 => 无事
  #    energy_block.*     -> ckpt 有，会被加载。**但它在 stage-1 里是零梯度的**
  #      （energy 损失系数 0，只为保住 DDP），5 epoch 里仅被解耦 wd 缩了约 0.3%。
  #      也就是说加载进来的 energy head ≈ 原始随机初始化 —— 这正是"微调时重置"想要的效果，
  #      不必再额外剥 key。代价是本臂的能量头是从零学起，故上面把 warmup 拉长到 0.5 ep。
  #
  #  下面这条路径对应 stage-1 配置 pretrain_pure_N2L2C64.yml
  #  （adanorm + use_node_feat + freeze none）的最近一次完成运行。换臂时用 CLI 覆盖：
  #    --optim.load_pretrained_weights=<其它 stage-1 best_checkpoint.pt>
  ######################################################################################
