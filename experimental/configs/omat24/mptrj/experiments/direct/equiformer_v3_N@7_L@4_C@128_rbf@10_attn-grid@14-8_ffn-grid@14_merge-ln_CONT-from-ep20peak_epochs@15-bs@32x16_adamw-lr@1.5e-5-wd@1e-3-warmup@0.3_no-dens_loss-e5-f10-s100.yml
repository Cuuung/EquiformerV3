dataset:
  train:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/train
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True
    transforms:
      #decompose_tensor:
      #  tensor: stress
      #  rank: 2
      #  decomposition:
      #    stress_isotropic:
      #      irrep_dim: 0
      #    stress_anisotropic:
      #      irrep_dim: 2

      normalizer:
        #######################################################################################
        #   Use either `fit`, `file` or specifying everything
        #   1.  If loading from a checkpoint, the values from using `fit` will be overwritten
        #######################################################################################
        #fit:
        #  targets:
        #    energy: { mean: 0.0}
        #    forces: { mean: 0.0 }
        #    stress: { mean: 0.0 }
        #    #stress_isotropic: { }
        #    #stress_anisotropic: { mean: 0.0 }
        #  batch_size: 64
        #  num_batches: 10000
        #file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_normalizer.pt
        energy:
          mean:     0.0
          rmsd:     0.8124567446457275    # (1) Following eSEN
                                          # (2) Remove the division after sum aggregation for energy prediction
        forces:
          mean:     0.0
          rmsd:     0.8124567446457275
        stress:
          mean:     0.0
          rmsd:     0.8124567446457275
        #isotropic_stress:
        #  mean:     -0.003037823364138603
        #  stdev:    0.06647835671901703
        #anisotropic_stress:
        #  mean:     0.0
        #  stdev:    0.026824669912457466

      element_references:
        #######################################################################################
        #   Use either `fit` or `file`
        #   1.  If loading from a checkpoint, the values from using `fit` will be overwritten
        #######################################################################################
        #fit:
        #  targets:
        #    - energy
        #  batch_size: 64
        #  num_batches: 1000
        #file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_element_references.pt
        energy:
          file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_energy_element_references.npz

  val:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/val
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True


trainer:              equiformer_v3_dens_trainer


logger:
  name:               wandb
  project:            equiformer_v3_mptrj


hide_eval_progressbar: False


evaluation_metrics:
  primary_metric: forces_mae
  metrics:
    energy:
      - mae
      - per_atom_mae
    forces:
      - mae
      - cosine_similarity
    stress:
      - mae


outputs:
  energy:
    level:                system
    property:             energy
  forces:
    level:                atom
    property:             forces
    train_on_free_atoms:  True
    eval_on_free_atoms:   True
  stress:
    level:                system
    property:             stress


loss_functions:
  - energy:
      fn:                 per_atom_mae
      coefficient:        5      # E:F:S = 5:10:100 (unchanged from the recipe that produced the ep20 peak)
  - forces:
      fn:                 l2mae
      coefficient:        10
  - stress:
      fn:                 mae
      coefficient:        100


model:
  name:                         equiformer_v3_dens

  use_pbc:                      True
  use_pbc_single:               True      # Process batch PBC graphs one at a time.
                                          # This argument is set to True when training on MPtrj.
  otf_graph:                    True

  regress_forces:               True
  regress_stress:               True
  direct_prediction:            True

  max_neighbors:                300
  max_radius:                   6.0
  num_radial_basis:             10
  max_num_elements:             128

  num_layers:                   7       # paper ~30M MPtrj model (Table 10)
  num_channels:                 128     # paper d_embed (4, 128)
  attn_hidden_channels:         32
  num_heads:                    8
  attn_alpha_channels:          64
  attn_value_channels:          16
  ffn_hidden_channels:          512
  norm_type:                    'merge_layer_norm'  # ['sep_layer_norm', 'sep_layer_norm_liger']

  lmax:                         4       # paper Lmax=4
  mmax:                         2
  attn_grid_resolution_list:    [14,  8]
  ffn_grid_resolution_list:     [14, 14]

  edge_channels:                128
  use_atom_edge_embedding:      True
  use_envelope:                 True

  attn_activation:              'sep-merge_gates2_swiglu'
  use_attn_renorm:              True
  use_add_merge:                False
  use_rad_l_parametrization:    True
  softcap:                      null
  ffn_activation:               'sep-merge_gates2_swiglu'
  use_grid_mlp:                 True

  use_gate_force_head:          True

  alpha_drop:                   0.0
  attn_mask_rate:               0.0
  attn_weights_drop:            0.1
  value_drop:                   0.0
  drop_path_rate:               0.05
  proj_drop:                    0.0
  ffn_drop:                     0.0

  gradient_checkpointing_block_list:    [0, 0, 0, 0, 0, 0, 0]   # length == num_layers (7). OFF for direct (fp16, single
                                                                # backward). If OOM on A100-80GB, flip to [1,1,1,1,1,1,1].

  enforce_max_neighbors_strictly:       True

  avg_num_nodes:                1       # Remove the division after sum aggregation over nodes for energy prediction


optim:
  #####################################################################################
  #  ===== AdamW LOW-LR REFINEMENT ("polish") from the ep20 peak (15ep, 16 GPU, 32x16=512) =====
  #
  #  WHY ADAMW, NOT MUON (the whole point of this config).  The prior Scheme-S run tried to
  #  refine this SAME ep20 peak with HybridMuon @ muon_lr=5e-5 (BELOW the ~7.8e-5 effective lr
  #  at which the original 35ep run diverged) with FRESH momentum -- and it STILL blew up:
  #    - ep0-1.8 healthy (train cos ~0.79, fmae ~0.020, NS-input RMS ~0.1-0.38);
  #    - ep2.0 ignition: first val already forces_mae=NaN (-> NO best_checkpoint ever written);
  #    - ep2.0->2.7 forward-pass blowup (train cos 0.68->0.35, fmae 0.035->0.18, loss 1.7->6.0);
  #    - RMS then COLLAPSED to 0 (2.9->1e-7->1e-12->0) as the forward went all-NaN;
  #    - limped ~3h on NaN losses until AMP GradScaler->0 hard-aborted at ep5.51/step15300.
  #  ROOT CAUSE: Muon's Newton-Schulz-orthogonalized update is gradient-magnitude-INDEPENDENT
  #  (constant ~0.17*lr step regardless of how small the gradient is), so on an ALREADY-CONVERGED
  #  sharp minimum it cannot settle -- it keeps taking constant-size steps and slowly walks the
  #  weights OUT of the basin (over ~2 epochs here) until the forward hits fp16-overflow -> NaN.
  #  The abs backstop (spike_abs_threshold=4.0) never fired because the *gradient* RMS stayed
  #  small; it is the *weights* that wandered, not the gradients that spiked. Lowering muon_lr
  #  only DELAYS this (5e-5 bought ~2 epochs), it cannot fix it. => Muon is the WRONG tool for a
  #  low-lr refinement/continuation from a converged minimum. See memory: muon-divergence-lessons.
  #
  #  ADAMW FIXES IT AT THE ROOT: per-coordinate adaptive step lr/(sqrt(v_hat)+eps) SELF-ANNEALS --
  #  as gradients vanish near the minimum the step vanishes too, so AdamW can actually SETTLE into
  #  the basin instead of wandering out. This is a pure config change (optimizer HybridMuon->AdamW),
  #  no trainer/guard edits.
  #
  #  START = the 06-20 mlr@2e-4/35ep run's best_checkpoint.pt = its ep20 pre-collapse PEAK
  #  (fp32 re-eval: forces_cos 0.7664 / forces_mae 0.0253). Loaded WEIGHTS-ONLY via
  #  --optim.load_pretrained_weights on the CLI (no optimizer/scheduler state inherited).
  #
  #  GOAL: squeeze the last few % of force-mae to probe the MP CPS gap to SOTA (memory: we are only
  #  ~1.7% CPS behind SOTA, so a ~3% fmae gain is large). INTERNAL probe, NOT a publishable pipeline.
  #
  #  DeNS is turned OFF for this refine (use_denoising_pos: False): the positional-noise injection is
  #  a secondary destabilizer on an already-converged sharp basin, and the polish only cares about the
  #  E/F/S targets. Flip back to True if you want to keep the exact training distribution of the peak.
  #  --amp stays ON (direct force = fp16, same regime as the peak); AdamW staying in-basin means the
  #  fp16-overflow that killed Scheme S should not recur. If any "Found nans" appears, fall back to
  #  fp32 (drop --amp in the submit script).
  #####################################################################################
  batch_size:                   32      # per-GPU; run on 16 GPU -> global 512 (same global batch as the peak run)
  grad_accumulation_steps:      1
  eval_batch_size:              32
  load_balancing:               atoms
  num_workers:                  0       # lmdb env not fork-safe -> num_workers>0 segfaults
  load_pretrained_weights:      PLACEHOLDER_OVERRIDDEN_ON_CLI  # weights-only load of the ep20 peak best_checkpoint.pt;
                                        # the submit command passes the REAL path via --optim.load_pretrained_weights=...
  lr_initial:                   0.000015 # 1.5e-5: low AdamW refinement lr for ALL params (~13x below the 2e-4 fresh-train lr).
                                        # A polish, not a re-train. Detune to 1e-5 if val degrades early; push to 2e-5 for a
                                        # slightly more aggressive probe. Cosine-decayed to ~1.5e-8 by the end.

  optimizer:                    AdamW
  optimizer_params:
    weight_decay:               0.001
    betas:                      [0.9, 0.95]
    eps:                        1.0e-8
  scheduler:                    LambdaLR
  scheduler_params:
    lambda_type:                cosine
    warmup_factor:              0.001   # start at a tiny non-zero lr instead of exactly 0.
    warmup_epochs:              0.3     # brief ramp to ease AdamW (fresh optimizer state) back in without a step-0 jolt.
    lr_min_factor:              0.001   # decay the eff lr to ~1.5e-8 by the end so the tail step -> ~0 (locks the basin).

  max_epochs:                   15    # LOW-LR REFINEMENT window sized for 16-GPU wall-clock ~14h (DeNS off -> slightly faster
                                      # than the ~0.94 h/epoch DeNS-on rate). cosine denominator = 15 (fresh schedule).
  clip_grad_norm:               100
  ema_decay:                    0.999

  eval_every:                   2500    # finer than the 5000 cadence: a low-lr polish improves in small increments and the
                                        # best may appear early, so evaluate ~every 0.8ep to catch the true peak best_checkpoint.

  use_denoising_pos:            False   # DeNS OFF for the refine (see header). The denoising_pos_params below are inert while off.
  denoising_pos_params:
    prob:                       0.5
    fixed_noise_std:            True
    std:                        0.025
    corrupt_ratio:              0.5
    num_steps:                  50    # not used
    std_low:                    0.01  # not used
    std_high:                   0.5   # not used
    min_num_atoms:              null
    strict_max_ratio:           0.75
  denoising_pos_coefficient:    10

  use_compile:                  True
