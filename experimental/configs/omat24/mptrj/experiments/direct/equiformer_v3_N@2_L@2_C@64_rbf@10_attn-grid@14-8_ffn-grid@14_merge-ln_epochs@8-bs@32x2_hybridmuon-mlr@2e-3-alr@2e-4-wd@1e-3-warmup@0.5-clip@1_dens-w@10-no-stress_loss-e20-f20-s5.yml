dataset:
  train:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/train
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True
    transforms:
      #decompose_tensor:
      #  tensor: stress
      #  rank: 2
      #  decomposition:
      #    stress_isotropic:
      #      irrep_dim: 0
      #    stress_anisotropic:
      #      irrep_dim: 2

      normalizer:
        #######################################################################################
        #   Use either `fit`, `file` or specifying everything
        #   1.  If loading from a checkpoint, the values from using `fit` will be overwritten
        #######################################################################################
        #fit:
        #  targets:
        #    energy: { mean: 0.0}
        #    forces: { mean: 0.0 }
        #    stress: { mean: 0.0 }
        #    #stress_isotropic: { }
        #    #stress_anisotropic: { mean: 0.0 }
        #  batch_size: 64
        #  num_batches: 10000
        #file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_normalizer.pt
        energy:
          mean:     0.0
          rmsd:     0.8124567446457275    # (1) Following eSEN
                                          # (2) Remove the division after sum aggregation for energy prediction
        forces:
          mean:     0.0
          rmsd:     0.8124567446457275
        stress:
          mean:     0.0
          rmsd:     0.8124567446457275
        #isotropic_stress:
        #  mean:     -0.003037823364138603
        #  stdev:    0.06647835671901703
        #anisotropic_stress:
        #  mean:     0.0
        #  stdev:    0.026824669912457466

      element_references:
        #######################################################################################
        #   Use either `fit` or `file`
        #   1.  If loading from a checkpoint, the values from using `fit` will be overwritten
        #######################################################################################
        #fit:
        #  targets:
        #    - energy
        #  batch_size: 64
        #  num_batches: 1000
        #file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_element_references.pt
        energy:
          file: experimental/configs/omat24/mptrj/preprocessing/equiformer_v2_mptrj_energy_element_references.npz

  val:
    format: ase_db
    src:
      - /mnt/afs/share/dataset/periodicSystem/MPtrj/aselmdb/val
    a2g_args:
      r_energy: True      # already use `uncorrected_total_energy` after pre-processing
      r_forces: True
      r_stress: True


trainer:              equiformer_v3_dens_trainer


logger:
  name:               wandb
  project:            equiformer_v3_mptrj


hide_eval_progressbar: False


evaluation_metrics:
  primary_metric: forces_mae
  metrics:
    energy:
      - mae
      - per_atom_mae
    forces:
      - mae
      - cosine_similarity
    stress:
      - mae


outputs:
  energy:
    level:                system
    property:             energy
  forces:
    level:                atom
    property:             forces
    train_on_free_atoms:  True
    eval_on_free_atoms:   True
  stress:
    level:                system
    property:             stress


loss_functions:
  - energy:
      fn:                 per_atom_mae
      coefficient:        20     # Both paper and checkpoint use 20 instead of 5
  - forces:
      fn:                 l2mae
      coefficient:        20
  - stress:
      fn:                 mae
      coefficient:        5


model:
  name:                         equiformer_v3_dens

  use_pbc:                      True
  use_pbc_single:               True      # Process batch PBC graphs one at a time.
                                          # This argument is set to True when training on MPtrj.
  otf_graph:                    True

  regress_forces:               True
  regress_stress:               True
  direct_prediction:            True

  max_neighbors:                300
  max_radius:                   6.0
  num_radial_basis:             10
  max_num_elements:             128

  num_layers:                   2
  num_channels:                 64
  attn_hidden_channels:         32
  num_heads:                    8
  attn_alpha_channels:          64
  attn_value_channels:          16
  ffn_hidden_channels:          512
  norm_type:                    'merge_layer_norm'  # ['sep_layer_norm', 'sep_layer_norm_liger']

  lmax:                         2
  mmax:                         2
  attn_grid_resolution_list:    [14,  8]
  ffn_grid_resolution_list:     [14, 14]

  edge_channels:                128
  use_atom_edge_embedding:      True
  use_envelope:                 True

  attn_activation:              'sep-merge_gates2_swiglu'
  use_attn_renorm:              True
  use_add_merge:                False
  use_rad_l_parametrization:    True
  softcap:                      null
  ffn_activation:               'sep-merge_gates2_swiglu'
  use_grid_mlp:                 True

  use_gate_force_head:          True

  alpha_drop:                   0.0
  attn_mask_rate:               0.0
  attn_weights_drop:            0.1
  value_drop:                   0.0
  drop_path_rate:               0.05
  proj_drop:                    0.0
  ffn_drop:                     0.0

  gradient_checkpointing_block_list:    [0, 0]

  enforce_max_neighbors_strictly:       True

  avg_num_nodes:                1       # Remove the division after sum aggregation over nodes for energy prediction


optim:
  batch_size:                   32      # CHANGED 192->32 (从 2卡2ep Muon 冒烟经验): smaller batch for HybridMuon stability; 2 GPU -> global 64.
  grad_accumulation_steps:      1
  eval_batch_size:              32
  load_balancing:               atoms
  num_workers:                  0       # lmdb env not fork-safe -> num_workers>0 segfaults
  lr_initial:                   0.0002  # AdamW lr for the NON-matrix params (biases, norms, embeddings)

  #####################################################################################
  #  Muon counterpart of the AdamW 8ep direct config:
  #    ...epochs@8-bs@192x2-wd@1e-3-beta2@0.95_dens-...-no-stress.yml
  #  Kept from that config: loss 20:20:5, 8ep direct, denoising, use_compile.
  #  CHANGED for HybridMuon stability (from the 2-card 2ep Muon smoke experience):
  #    batch 192->32 (2 GPU global 64), warmup 0.0/0.1 -> 1e-3/0.5, clip 100 -> 1.0,
  #    and the optimizer block below (HybridMuon, muon_lr 2e-3).
  #
  #  HybridMuon: Muon (Newton-Schulz orthogonalized momentum) for the weight matrices
  #  (nn.Linear 2D + SO3Linear 3D), AdamW for biases / norms / embeddings.
  #  - muon_lr is the MAIN knob; Muon updates are gradient-magnitude-insensitive so
  #    muon_lr alone sets the matrix step (~muon_lr*sqrt(out/in)). 2e-3 here is a
  #    further reduction (0.01 diverged ~epoch1.7 on 8 GPU; 0.005 was the 2-card smoke).
  #  - lr_initial (above) is the AdamW lr applied to the non-matrix params.
  #  - Under plain DDP this is correct (grads all-reduced before step). Compatible
  #    with --amp, clip_grad_norm, grad accum, LambdaLR.
  #####################################################################################
  optimizer:                    HybridMuon
  optimizer_params:
    weight_decay:               0.001
    muon_lr:                    0.002     # Muon lr for weight matrices (key hyper-param); further lowered to 2e-3.
    momentum:                   0.95      # Muon momentum
    nesterov:                   True      # Muon nesterov look-ahead
    ns_steps:                   5         # Newton-Schulz iterations
    betas:                      [0.9, 0.95]   # AdamW path
    eps:                        1.0e-8
  scheduler:                    LambdaLR
  scheduler_params:
    lambda_type:                cosine
    warmup_factor:              0.001   # CHANGED 0.0 -> 1e-3 (从冒烟经验): start at a tiny non-zero lr.
    warmup_epochs:              0.5     # CHANGED 0.1 -> 0.5 (从冒烟经验): longer ramp to ease HybridMuon into full lr.
    lr_min_factor:              0.01

  max_epochs:                   8     # stage-1 direct-force pretrain; stage-2 = separate gradient-force finetune (2ep) loading this ckpt
  clip_grad_norm:               1.0   # CHANGED 100 -> 1.0 (从冒烟经验): 100 was effectively off; 1.0 actually clips spikes.
  ema_decay:                    0.999

  eval_every:                   5000

  use_denoising_pos:            True
  denoising_pos_params:
    prob:                       0.5
    fixed_noise_std:            True
    std:                        0.025
    corrupt_ratio:              0.5
    num_steps:                  50    # not used
    std_low:                    0.01  # not used
    std_high:                   0.5   # not used
    min_num_atoms:              null
    strict_max_ratio:           0.75
  denoising_pos_coefficient:    10

  use_compile:                  True
